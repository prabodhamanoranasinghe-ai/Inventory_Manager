{% extends "base.html" %}
{% block content %}
  <h1 class="h3 mb-3">Generate Bill</h1>

  <form method="post" action="{{ url_for('create_invoice') }}" id="invoiceForm">
    <div class="row g-3 mb-3">
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5">Customer</h2>
            <div class="mb-2">
              <label class="form-label">Existing Customer</label>
              <select class="form-select" name="customer_id">
                <option value="">Walk-in / New Customer</option>
                {% for customer in customers %}
                  <option value="{{ customer.id }}">{{ customer.name }}{% if customer.phone %} - {{ customer.phone }}{% endif %}</option>
                {% endfor %}
              </select>
            </div>
            <p class="small text-muted mb-1">Or enter new customer details:</p>
            <div class="mb-2">
              <input class="form-control" name="customer_name" placeholder="Customer Name" />
            </div>
            <div class="mb-2">
              <input class="form-control" type="email" name="customer_email" placeholder="Email" />
            </div>
            <div>
              <input class="form-control" name="customer_phone" placeholder="Phone" />
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="h5">Invoice Meta</h2>
            <div class="row g-2">
              <div class="col-md-6">
                <label class="form-label">Tax Rate (%)</label>
                <input class="form-control" type="number" min="0" step="0.01" name="tax_rate" id="taxRate" value="0" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Discount</label>
                <input class="form-control" type="number" min="0" step="0.01" name="discount" id="discount" value="0" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Tax Type</label>
                <select class="form-select" name="tax_type">
                  {% for tax in tax_types %}
                    <option value="{{ tax }}">{{ tax }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Payment Method</label>
                <select class="form-select" name="payment_method">
                  <option value="cash">Cash</option>
                  <option value="card">Card</option>
                  <option value="upi">UPI</option>
                  <option value="bank_transfer">Bank Transfer</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                  <option value="PAID">PAID</option>
                  <option value="PENDING">PENDING</option>
                  <option value="PARTIAL">PARTIAL</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 m-0">Line Items</h2>
          <button class="btn btn-sm btn-outline-primary" id="addLineBtn" type="button">+ Add Item</button>
        </div>

        <div class="table-responsive">
          <table class="table" id="lineItemsTable">
            <thead>
              <tr>
                <th>Product</th>
                <th style="width: 120px">Available</th>
                <th style="width: 140px">Unit Price</th>
                <th style="width: 120px">Quantity</th>
                <th style="width: 140px">Line Total</th>
                <th style="width: 80px"></th>
              </tr>
            </thead>
            <tbody>
              <tr class="invoice-row">
                <td>
                  <select class="form-select line-product" name="product_id[]" required>
                    <option value="">Select Product</option>
                    {% for product in products %}
                      <option
                        value="{{ product.id }}"
                        data-price="{{ product.unit_price }}"
                        data-stock="{{ product.stock_quantity }}"
                      >
                        {{ product.name }} ({{ product.sku }})
                      </option>
                    {% endfor %}
                  </select>
                </td>
                <td><input type="text" class="form-control line-stock" value="0" readonly /></td>
                <td><input type="text" class="form-control line-price" value="0.00" readonly /></td>
                <td>
                  <input class="form-control line-qty" name="quantity[]" type="number" min="1" value="1" required />
                </td>
                <td><input type="text" class="form-control line-total" value="0.00" readonly /></td>
                <td>
                  <button class="btn btn-sm btn-outline-danger remove-line-btn" type="button">X</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
          <div><strong>Subtotal:</strong> $ <span id="subtotalValue">0.00</span></div>
          <div><strong>Tax:</strong> $ <span id="taxValue">0.00</span></div>
          <div><strong>Grand Total:</strong> $ <span id="grandTotalValue">0.00</span></div>
        </div>
        <button class="btn btn-success btn-lg" type="submit">Generate Bill</button>
      </div>
    </div>
  </form>
{% endblock %}
